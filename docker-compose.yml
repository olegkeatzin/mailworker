services:
  mailworker:
    build: .
    image: mailworker:1.0.0
    container_name: mailworker
    restart: unless-stopped
    environment:
      # Часовой пояс влияет на дату регистрации и окно since_days
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # UI_PORT — внешний порт на хосте; внутри контейнера всегда 8080
      # (его задаёт [ui] port в config.ini). Включите [ui] enabled = true.
      - "${UI_PORT:-8080}:8080"
    volumes:
      # Настройки — только чтение; данные служба пишет в /app/data
      - ./config:/app/config:ro
      - ./data:/app/data
    stop_grace_period: 30s